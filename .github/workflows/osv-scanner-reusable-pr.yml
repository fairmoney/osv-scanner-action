# OSV-Scanner PR scanning reusable workflow, can be used as a PR action to detect new vulnerabilities being introduced.
name: "OSV-Scanner PR Scanning"



on:
  workflow_call:
    inputs:
      scan-args:
        description: "Custom osv-scanner arguments (See https://google.github.io/osv-scanner/usage/ for options, you cannot set --format or --output)"
        type: string
        default: |-
          -r
          ./
      results-file-name:
        description: "File name of the result SARIF file"
        type: string
        default: results.sarif
      upload-sarif:
        description: "Whether to upload to Security > Code Scanning"
        type: boolean
        required: false
        default: true
      fail-on-vuln:
        description: "Whether to fail the action on vulnerability found"
        type: boolean
        default: true
      matrix-property:
        description: "Optional string for matrix strategies (E.g. 'amd64-')"
        type: string
        default: ""
      checkout-submodules:
        description: "Whether to check out submodules or not. Passed on to `submodules` argument of `actions/checkout`"
        type: boolean
        default: false
      export-results:
        description: "Whether to export the scan results as job outputs (can fail for large repositories due to size limits)"
        type: boolean
        default: false
      go-private-modules:
        description: "GOPRIVATE pattern of private Go modules govulncheck may fetch with the OSV_SCANNER_APP_* GitHub App token (E.g. 'github.com/my-org/*'). Empty: none"
        type: string
        default: ""
      runs-on:
        description: "The runner to use for the scan job (E.g. 'ubuntu-latest', 'ubuntu-24.04', or a self-hosted runner label)"
        type: string
        default: "ubuntu-latest"
    secrets:
      OSV_SCANNER_APP_CLIENT_ID:
        description: "Optional client ID of a GitHub App installed on the repositories of the private modules matched by go-private-modules. With OSV_SCANNER_APP_PRIVATE_KEY, the job mints a contents:read installation token and hands it to git in the scanner container through GIT_CONFIG_* env only. When either is empty or absent, call analysis of private modules fails as before and the scan falls back to the go.mod package list"
        required: false
      OSV_SCANNER_APP_PRIVATE_KEY:
        description: "Optional private key (PEM) of the GitHub App named by OSV_SCANNER_APP_CLIENT_ID"
        required: false
    outputs:
      old-results:
        description: "Results of the scan before the PR in JSON format"
        value: ${{ jobs.osv-scan.outputs.old-results }}
      new-results:
        description: "Results of the scan after the PR in JSON format"
        value: ${{ jobs.osv-scan.outputs.new-results }}

jobs:
  osv-scan:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
      actions: read
      contents: read
      security-events: write
    outputs:
      old-results: ${{ steps.export.outputs.old-results }}
      new-results: ${{ steps.export.outputs.new-results }}
    env:
      # The secrets context is not available in step `if:` conditions, so the
      # token step below keys off this instead.
      OSV_SCANNER_APP_CONFIGURED: ${{ secrets.OSV_SCANNER_APP_CLIENT_ID != '' && secrets.OSV_SCANNER_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: ${{ inputs.checkout-submodules }}
          # Do persist credentials, as we need it for the git checkout later
      - name: "Checkout target branch"
        run: |
          git checkout $GITHUB_BASE_REF
          git submodule update --recursive
      - name: "Mint read-only token for private Go modules"
        id: "go-modules-token"
        # Only when there are private modules to fetch: otherwise the token would
        # reach the scanner container for nothing.
        if: ${{ env.OSV_SCANNER_APP_CONFIGURED == 'true' && inputs.go-private-modules != '' }}
        # A failure here (e.g. app not installed, key rotated) leaves the step red
        # but lets the scan run without the token, i.e. the go.mod fallback,
        # rather than failing every consumer's scan on an app misconfiguration.
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.OSV_SCANNER_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSV_SCANNER_APP_PRIVATE_KEY }}
          # Every repository the app installation can see, not just this one.
          owner: ${{ github.repository_owner }}
          permission-contents: read
      - name: "Warn when the private Go modules token could not be minted"
        if: ${{ steps.go-modules-token.outcome == 'failure' }}
        run: echo "::warning::Could not mint the OSV_SCANNER_APP_* GitHub App token; govulncheck call analysis of private modules falls back to the go.mod package list"
      - name: "Run scanner on existing code"
        id: "scan-old"
        # The scanner container receives a GitHub App token, so its image is
        # pinned by digest rather than through google/osv-scanner-action's
        # action.yml, which uses the mutable tag. Digest of
        # ghcr.io/google/osv-scanner-action:v2.7.0 (multi-arch index), resolved
        # 2026-11-09. Bump it together with the reporter action's version.
        # The action's entrypoint splits its last argument on whitespace, so
        # passing the scan args as `args` gives osv-scanner the same arguments.
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
        env:
          GOTOOLCHAIN: auto
          # Private Go modules for govulncheck call analysis: GOPRIVATE makes Go
          # fetch them directly, and git gets the token as an insteadOf rewrite
          # from GIT_CONFIG_* env (never a file or a command-line argument).
          # GIT_CONFIG_COUNT is 0 without a token, which keeps today's fallback.
          GOPRIVATE: ${{ inputs.go-private-modules }}
          GIT_CONFIG_COUNT: ${{ steps.go-modules-token.outputs.token != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: ${{ steps.go-modules-token.outputs.token != '' && format('url.https://x-access-token:{0}@github.com/.insteadOf', steps.go-modules-token.outputs.token) || '' }}
          GIT_CONFIG_VALUE_0: https://github.com/
        continue-on-error: true
        with:
          args: |-
            --format=json
            --output=${{ inputs.matrix-property }}old-results.json
            ${{ inputs.scan-args }}
      - name: "Checkout current branch"
        # Use -f in case any changes were made by osv-scanner (there should be no changes)
        run: |
          git checkout -f $GITHUB_SHA
          git submodule update --recursive
      - name: "Run scanner on new code"
        id: "scan-new"
        # The scanner container receives a GitHub App token, so its image is
        # pinned by digest rather than through google/osv-scanner-action's
        # action.yml, which uses the mutable tag. Digest of
        # ghcr.io/google/osv-scanner-action:v2.7.0 (multi-arch index), resolved
        # 2026-11-09. Bump it together with the reporter action's version.
        # The action's entrypoint splits its last argument on whitespace, so
        # passing the scan args as `args` gives osv-scanner the same arguments.
        uses: docker://ghcr.io/google/osv-scanner-action@sha256:d54770fe0b09493894e76a02aaed9f51a0513fa57c5186452a755d257b0068a6
        env:
          GOTOOLCHAIN: auto
          # Private Go modules for govulncheck call analysis: GOPRIVATE makes Go
          # fetch them directly, and git gets the token as an insteadOf rewrite
          # from GIT_CONFIG_* env (never a file or a command-line argument).
          # GIT_CONFIG_COUNT is 0 without a token, which keeps today's fallback.
          GOPRIVATE: ${{ inputs.go-private-modules }}
          GIT_CONFIG_COUNT: ${{ steps.go-modules-token.outputs.token != '' && '1' || '0' }}
          GIT_CONFIG_KEY_0: ${{ steps.go-modules-token.outputs.token != '' && format('url.https://x-access-token:{0}@github.com/.insteadOf', steps.go-modules-token.outputs.token) || '' }}
          GIT_CONFIG_VALUE_0: https://github.com/
        with:
          args: |-
            --format=json
            --output=${{ inputs.matrix-property }}new-results.json
            ${{ inputs.scan-args }}
        continue-on-error: true
      # osv-scanner exits non-zero both when it finds vulnerabilities, which the
      # reporter step below is responsible for acting on, and when the scan itself
      # fails, so the continue-on-error above cannot tell the two apart. A scan that
      # fails writes no results file, and the reporter treats a missing --new file as
      # "no new vulnerabilities" and exits 0. Since the new-code scan runs against the
      # contents of the pull request, that would let a change which stops the scanner
      # from completing pass as a clean diff. Compare only scans that produced results.
      - name: "Check that both scans completed"
        if: ${{ steps.scan-old.outcome == 'failure' || steps.scan-new.outcome == 'failure' }}
        env:
          OLD_OUTCOME: ${{ steps.scan-old.outcome }}
          NEW_OUTCOME: ${{ steps.scan-new.outcome }}
          OLD_RESULTS: ${{ inputs.matrix-property }}old-results.json
          NEW_RESULTS: ${{ inputs.matrix-property }}new-results.json
        run: |
          status=0
          if [ "${OLD_OUTCOME}" = "failure" ] && [ ! -s "${OLD_RESULTS}" ]; then
            echo "::error::OSV-Scanner failed on the target branch without writing ${OLD_RESULTS}. See the \"Run scanner on existing code\" step for the cause."
            status=1
          fi
          if [ "${NEW_OUTCOME}" = "failure" ] && [ ! -s "${NEW_RESULTS}" ]; then
            echo "::error::OSV-Scanner failed on this branch without writing ${NEW_RESULTS}. See the \"Run scanner on new code\" step for the cause."
            status=1
          fi
          if [ "${status}" -ne 0 ]; then
            echo "::error::A scan did not complete, so the two sets of results cannot be compared. Failing the job rather than reporting no new vulnerabilities found."
          fi
          exit "${status}"
      - name: "Run osv-scanner-reporter"
        uses: google/osv-scanner-action/osv-reporter-action@0a65f82af05cd58cf587827b0bb0489548c18346 # v2.7.0
        with:
          scan-args: |-
            --output=${{ inputs.matrix-property }}${{ inputs.results-file-name }}
            --old=${{ inputs.matrix-property }}old-results.json
            --new=${{ inputs.matrix-property }}new-results.json
            --gh-annotations=true
            --fail-on-vuln=${{ inputs.fail-on-vuln }}
      # Exports the old and new results as JSON strings in environment
      # variables. Uses heredocs with random 16-character delimiters
      # to avoid interference between the JSON contents and the
      # environment variables.
      - name: "Export results"
        id: export
        if: ${{ inputs.export-results }}
        env:
          MATRIX_PROPERTY: ${{ inputs.matrix-property }}
        run: |
          DELIMITER="EOF_$(tr -dc 'a-zA-Z0-9' < /dev/urandom 2>/dev/null | head -c 16)"
          if [ -f "${MATRIX_PROPERTY}old-results.json" ]; then
            echo "old-results<<${DELIMITER}" >> "${GITHUB_OUTPUT}"
            cat "${MATRIX_PROPERTY}old-results.json" >> "${GITHUB_OUTPUT}"
            echo "${DELIMITER}" >> "${GITHUB_OUTPUT}"
          fi
          if [ -f "${MATRIX_PROPERTY}new-results.json" ]; then
            echo "new-results<<${DELIMITER}" >> "${GITHUB_OUTPUT}"
            cat "${MATRIX_PROPERTY}new-results.json" >> "${GITHUB_OUTPUT}"
            echo "${DELIMITER}" >> "${GITHUB_OUTPUT}"
          fi
      # Upload the results as artifacts (optional). Commenting out will disable uploads of run results in SARIF
      # format to the repository Actions tab.
      - name: "Upload artifact"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: OSV Scanner SARIF file
          path: ${{ inputs.matrix-property }}${{ inputs.results-file-name }}
          retention-days: 5
      - name: "Upload old scan json results"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.matrix-property }}old-json-results
          path: ${{ inputs.matrix-property }}old-results.json
          retention-days: 5
      - name: "Upload new scan json results"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.matrix-property }}new-json-results
          path: ${{ inputs.matrix-property }}new-results.json
          retention-days: 5
      # Upload the results to GitHub's code scanning dashboard.
      - name: "Upload to code-scanning"
        id: "upload_artifact"
        if: ${{ !cancelled() && inputs.upload-sarif == true }}
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: ${{ inputs.matrix-property }}${{ inputs.results-file-name }}
      - name: "Print Code Scanning PR URL"
        if: "${{ !cancelled() && inputs.upload-sarif == true }}"
        run: |
          echo "View the OSV-Scanner results for this PR in the 'Security' tab, using the following link:"
          echo "${{ github.server_url }}/${{ github.repository }}/security/code-scanning?query=pr%3A${{ github.event.pull_request.number }}"
      - name: "Error troubleshooter"
        if: ${{ always() && steps.upload_artifact.outcome == 'failure' }}
        run: |
          echo "::error::Artifact upload failed. This is most likely caused by a error during scanning earlier in the workflow."
